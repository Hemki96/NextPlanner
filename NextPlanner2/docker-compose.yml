services:
  postgres:
    image: postgres:16
    container_name: nextplanner2-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nextplanner
      POSTGRES_PASSWORD: nextplanner
      POSTGRES_DB: nextplanner2
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
