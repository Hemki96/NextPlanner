services:
  - type: web
    name: nextplanner2-api
    env: node
    rootDir: .
    plan: starter
    buildCommand: npm ci && npm run build -w packages/shared && npm run build -w apps/api
    startCommand: npm run start -w apps/api
    healthCheckPath: /readyz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: nextplanner2-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_TTL_SECONDS
        value: 900
      - key: REFRESH_TOKEN_TTL_SECONDS
        value: 2592000
      - key: POLL_INTERVAL_MS
        value: 30000
      - key: LOG_LEVEL
        value: info

  - type: web
    name: nextplanner2-web
    env: static
    rootDir: .
    buildCommand: npm ci && npm run build -w packages/shared && npm run build -w apps/web
    staticPublishPath: apps/web/dist
    pullRequestPreviewsEnabled: true
    envVars:
      - key: VITE_API_BASE_URL
        sync: false

databases:
  - name: nextplanner2-db
    plan: starter
